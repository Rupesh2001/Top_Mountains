name: CD - UAT

# Every push to main: test, build once, deploy to UAT, verify UAT.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cd-uat
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm test
      - run: npm run build          # must output to dist/

      - uses: actions/upload-artifact@v4
        with:
          name: app-build
          path: dist/
          retention-days: 14

  deploy-uat:
    needs: build
    uses: ./.github/workflows/_deploy.yml
    with:
      environment: uat
      release_id: ${{ github.sha }}
    secrets: inherit
    permissions:
      contents: read
      actions: read
