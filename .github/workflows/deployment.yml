name: CI-CD (UAT to Production)

on:
  push:
    branches: [main]
  workflow_dispatch:

# Only one deployment pipeline at a time per branch; never cancel a running deploy
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # 1. Test and build ONCE. The same artifact is promoted to UAT, then production.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm test
      - run: npm run build          # must output to dist/ (change if yours differs)

      - uses: actions/upload-artifact@v4
        with:
          name: app-build
          path: dist/
          retention-days: 7

  # 2. Deploy to UAT automatically
  deploy-uat:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: uat
      url: ${{ vars.APP_URL }}      # e.g. https://uat.example.com
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: app-build
          path: dist

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts

      - name: Upload new release
        run: |
          rsync -az --delete dist/ \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ secrets.DEPLOY_PATH }}/releases/${{ github.sha }}/"

      - name: Switch to new release and clean old ones
        run: |
          ssh "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" "
            ln -sfn ${{ secrets.DEPLOY_PATH }}/releases/${{ github.sha }} ${{ secrets.DEPLOY_PATH }}/current &&
            ls -dt ${{ secrets.DEPLOY_PATH }}/releases/* | tail -n +6 | xargs -r rm -rf
          "

  # 3. Verify UAT is healthy. Production is blocked if this fails.
  smoke-test-uat:
    needs: deploy-uat
    runs-on: ubuntu-latest
    steps:
      - name: Check UAT responds
        run: |
          curl --fail --silent --show-error \
            --retry 5 --retry-delay 5 --retry-all-errors \
            "${{ vars.UAT_URL }}"
      # Add real checks here, for example:
      # - run: npx playwright test --grep @smoke

  # 4. Deploy the SAME build to the live URL
  #    Add "Required reviewers" on the production environment for a manual approval gate.
  deploy-production:
    needs: smoke-test-uat
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.APP_URL }}      # e.g. https://www.example.com
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: app-build
          path: dist

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts

      - name: Upload new release
        run: |
          rsync -az --delete dist/ \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ secrets.DEPLOY_PATH }}/releases/${{ github.sha }}/"

      - name: Switch to new release and clean old ones
        run: |
          ssh "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" "
            ln -sfn ${{ secrets.DEPLOY_PATH }}/releases/${{ github.sha }} ${{ secrets.DEPLOY_PATH }}/current &&
            ls -dt ${{ secrets.DEPLOY_PATH }}/releases/* | tail -n +6 | xargs -r rm -rf
          "

      - name: Verify production
        run: |
          curl --fail --silent --show-error \
            --retry 5 --retry-delay 5 --retry-all-errors \
            "${{ vars.APP_URL }}"

